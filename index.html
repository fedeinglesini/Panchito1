<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Arqueología</title>
    
    <!-- Script oficial de Google para el componente 3D -->
    <script type="module" src="https://unpkg.com/@model-viewer/public@v3.5.0/dist/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        model-viewer {
            width: 90%;
            max-width: 800px;
            height: 75vh;
            background-color: #2b2b2b;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Modelo 3D - 15/09/2026</h1>

    <!-- Visualizador con tu archivo .glb optimizado -->
    <model-viewer 
        src="15_9_2026.glb" 
        alt="Modelo 3D del pozo de sondeo" 
        auto-rotate 
        camera-controls 
        ar>
    </model-viewer>

</body>
</html>
